# Verificações de segurança em cada push e pull request:
# dependências com falhas conhecidas (pip-audit), análise estática (bandit),
# segredos no histórico (gitleaks) e o servidor tem de arrancar.
# As actions estão fixadas pelo commit (uma tag pode ser movida); atualizar de propósito.
name: Segurança

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0              # histórico inteiro para o gitleaks
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Dependências (hashes verificados)
        run: pip install --require-hashes -r requirements.txt

      - name: Ferramentas de auditoria
        run: pip install pip-audit==2.10.1 bandit==1.9.4

      - name: Falhas conhecidas nas dependências
        run: pip-audit -r requirements.txt

      - name: Análise estática
        run: bandit -q -r servidor.py definir_senha_admin.py configurar_banco_app.py blueprints dao modelos servicos

      - name: O servidor arranca
        env:
          DATABASE_URL: sqlite:///ci.db
          SECRET_KEY: so-para-o-ci
        run: python -c "import servidor; from dao import banco; banco.criar_tabela()"

      - name: Segredos no repositório
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
