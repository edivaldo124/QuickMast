{% extends 'base.html' %}
{% from '_componentes.html' import barra, voltar %}
{% block titulo %}QuickMast - {{ brinco }}{% endblock %}
{% block classe_pagina %} pagina--lista{% endblock %}
{# Dados para o JS em data-*: a CSP não permite <script> inline #}
{% block atributos_body %} data-brinco="{{ brinco }}"{% endblock %}

{% block cabecalho %}{{ barra(usuario) }}{% endblock %}

{% block conteudo %}
    {{ voltar() }}
    <h1>{{ brinco }}</h1>
    <p id="resumoVaca" class="resumo oculto-se-vazio"></p>
    <div id="mensagem" class="oculto-se-vazio" aria-live="polite"></div>

    {# data-entrada: os testes entram em cascata e a linha desenha-se (só na 1.ª vez) #}
    <ol id="linhaTempo" class="linha-tempo" data-entrada>
        {% for _ in range(3) %}
        <li class="evento evento--esqueleto" aria-hidden="true">
            <span class="ic evento__marcador"></span>
            <div class="cartao esqueleto"><span></span><span></span></div>
        </li>
        {% endfor %}
    </ol>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/componentes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vaca.js') }}"></script>
{% endblock %}
